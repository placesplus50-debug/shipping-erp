<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عهدة المندوب | Shipping Pulse</title><link rel="icon" href="/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#291b42;font-family:Cairo,Tahoma,Arial,sans-serif}header{background:linear-gradient(125deg,#23123d,#5b37aa);color:white;padding:24px 16px 38px}header a{color:#d9f477;text-decoration:none}main{max-width:800px;margin:-20px auto 0;padding:0 14px 100px;position:relative}h1{font-size:22px;margin:10px 0}h2{font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile,.card{background:#fff;border:1px solid #eae5f4;border-radius:17px;padding:16px;box-shadow:0 4px 15px #2b164012}.tile small{display:block;color:#756a82;font-size:12px}.tile strong{display:block;font-size:22px;color:#5334a0;margin-top:6px}.card{margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{background:#eee8fa;color:#5334a0;padding:5px 9px;border-radius:30px;font-size:12px}.muted{color:#776c83;font-size:12px}.error{color:#b22546}button{border:0;border-radius:12px;padding:10px 14px;background:#5534a6;color:#fff;font:inherit}nav{position:fixed;bottom:0;left:0;right:0;background:#24143f;display:flex;justify-content:space-around;padding:14px 8px}nav a{color:#fff;text-decoration:none;font-size:13px}nav a.active{color:#d7f276}@media(max-width:360px){.tile strong{font-size:18px}}</style></head><body><header><a href="/driver.html">← العودة لشحناتي</a><h1>عهدة المندوب</h1><p>تحصيلاتك وموقف التسوية مع الحسابات</p></header><main><div class="grid"><div class="tile"><small>بانتظار مراجعة المحاسب</small><strong id="pending">—</strong></div><div class="tile"><small>نقدية معاك معتمدة</small><strong id="cash">—</strong></div><div class="tile"><small>تم تسليمها</small><strong id="handed">—</strong></div><div class="tile"><small>مدفوعات لدى الشركة</small><strong id="company">—</strong></div></div><p id="message" role="status"></p><div class="row"><h2>تفاصيل التحصيلات</h2><button id="refresh">تحديث</button></div><div id="list"></div></main><nav><a href="/driver.html">شحناتي</a><a href="/driver-route.html">خط السير</a><a href="/driver-wallet.html" class="active">عهدتي</a></nav><script>
const $=id=>document.getElementById(id),money=v=>(Number(v||0)/100).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
function add(el,tag,value,cls){const n=document.createElement(tag);n.textContent=String(value??'—');if(cls)n.className=cls;el.append(n);return n}
function label(e){if(e.decision==='rejected')return 'مرفوض';if(!e.decision)return 'بانتظار المراجعة';if(e.handover_id!=null)return 'تم التسليم للحسابات';if(e.method==='cash')return 'نقدية مع المندوب';return 'مدفوع للشركة'}
async function load(){$('refresh').disabled=true;$('message').textContent='جارٍ التحميل...';try{const [a,b]=await Promise.all([fetch('/api/v2/collection-summary',{credentials:'same-origin',cache:'no-store'}),fetch('/api/collections',{credentials:'same-origin',cache:'no-store'})]);if(a.status===401||b.status===401){location.href='/login.html';return}const summary=await a.json(),data=await b.json();if(!a.ok||!b.ok||data.truncated)throw Error(summary.error||data.error||'سجل التحصيلات غير مكتمل');for(const [id,key] of [['pending','pendingReviewCents'],['cash','approvedDriverCashCents'],['handed','handedOverCashCents'],['company','companyHeldCents']])$(id).textContent=money(summary.summary[key]);const root=$('list');root.replaceChildren();for(const e of data.collections||[]){const card=document.createElement('article');card.className='card';const top=document.createElement('div');top.className='row';add(top,'strong',e.order_id+' • '+money(e.amount_cents));add(top,'span',label(e),'pill');card.append(top);add(card,'p','طريقة التحصيل: '+e.method+' | '+(e.created_at||''),'muted');if(e.review_note)add(card,'p','ملاحظة المراجعة: '+e.review_note,'muted');root.append(card)}if(!root.children.length)add(root,'p','لا توجد تحصيلات مسجلة','muted');$('message').textContent='تم تحديث الأرصدة'}catch(e){$('message').textContent=e.message;$('message').className='error'}finally{$('refresh').disabled=false}}$('refresh').onclick=load;load();
</script></body></html>
