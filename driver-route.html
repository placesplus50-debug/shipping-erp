<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خط السير | Shipping Pulse</title><link rel="icon" href="/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f8f6fc;color:#2a1945;font-family:Cairo,Tahoma,Arial,sans-serif}header{background:linear-gradient(120deg,#23133d,#55349e);color:white;padding:24px 16px 40px}header a{color:#d9f377}h1{font-size:23px}main{max-width:800px;margin:-22px auto 0;padding:0 14px 100px;position:relative}.card{background:#fff;border:1px solid #ebe6f3;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 4px 16px #29134610}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.num{border-radius:50%;background:#e9e2f8;color:#52329c;width:34px;height:34px;display:grid;place-items:center;font-weight:800;flex-shrink:0}.body{flex:1;min-width:0}.body strong{display:block}.body small{display:block;color:#81758d}.status{color:#5b3b9e;font-size:12px}a.action{display:inline-block;margin-top:9px;background:#5634a9;color:white;padding:9px 12px;border-radius:10px;text-decoration:none;font-size:12px}.muted{color:#776c86;font-size:13px}.error{color:#b12448}nav{position:fixed;bottom:0;left:0;right:0;background:#24143f;display:flex;justify-content:space-around;padding:14px}nav a{color:white;text-decoration:none;font-size:13px}nav a.active{color:#d9f377}</style></head><body><header><a href="/driver.html">← العودة لشحناتي</a><h1>خط سير الشحنات</h1><p>المحطات النشطة والملاحة إلى العملاء</p></header><main><p class="muted">الترتيب الحالي حسب مصدر الأوردرات، وليس تحسينًا آليًا للمسافة. لا نعرض موقعًا غير مؤكد باعتباره دقيقًا.</p><p id="message" role="status">جارٍ تحميل الشحنات...</p><div id="list"></div></main><nav><a href="/driver.html">شحناتي</a><a href="/driver-route.html" class="active">خط السير</a><a href="/driver-wallet.html">عهدتي</a></nav><script>
const $=id=>document.getElementById(id);function txt(el,tag,v,cls){const n=document.createElement(tag);n.textContent=String(v??'—');if(cls)n.className=cls;el.append(n);return n}
async function load(){try{const r=await fetch('/api/orders',{credentials:'same-origin',cache:'no-store'});if(r.status===401){location.href='/login.html';return}const d=await r.json();if(!r.ok||d.scope!=='assigned_driver')throw Error(d.error||'تعذر تحميل الشحنات المخصصة للمندوب');const active=(d.orders||[]).filter(o=>!['Delivered','Returned'].includes(o['Effective Shipping Status']||o['Shipping Status']));const root=$('list');root.replaceChildren();let mapped=0;for(const [i,o] of active.entries()){const card=document.createElement('article');card.className='card';const row=document.createElement('div');row.className='row';txt(row,'span',i+1,'num');const body=document.createElement('div');body.className='body';txt(body,'strong',o['Order ID']+' — '+(o.Customer||'—'));txt(body,'small',o['City / Area']||'العنوان غير متوفر');row.append(body);txt(row,'span',o['Effective Shipping Status']||o['Shipping Status'],'status');card.append(row);const raw=String(o['Google Maps URL']||'').trim();let valid=false;try{const u=new URL(raw);valid=u.protocol==='https:'&&/(^|\.)google\.[a-z.]+$|(^|\.)maps\.app\.goo\.gl$/.test(u.hostname)}catch{}if(valid){mapped++;const a=txt(card,'a','📍 فتح موقع العميل','action');a.href=raw;a.target='_blank';a.rel='noopener noreferrer'}else txt(card,'p','رابط الملاحة غير متوفر أو غير مؤكد','muted');root.append(card)}$('message').textContent=active.length+' شحنة نشطة • '+mapped+' بمواقع قابلة للفتح';if(!active.length)txt(root,'p','لا توجد شحنات نشطة حاليًا','muted')}catch(e){$('message').textContent=e.message;$('message').className='error'}}load();
</script></body></html>
