<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shipping Pulse — Responsive QA</title><style>body{font:14px Tahoma;background:#f0edf7;color:#251741;text-align:center;margin:16px}label{margin:12px}select,button{font:inherit;padding:8px}iframe{display:block;margin:20px auto;border:1px solid #a99bbf;border-radius:14px;background:white;height:780px;max-width:100%}</style><h1>فحص العرض المتجاوب — Preview</h1><p>عرض الصفحات الفعلية داخل مساحة موبايل. ليست محاكاة جهاز أو اختبار لمس.</p><label>الصفحة <select id="page"><option value="home">الرئيسية</option><option value="orders">الطلبات</option><option value="drivers">المندوبون</option><option value="collections">التحصيلات</option><option value="users">المستخدمون</option><option value="driver">واجهة المندوب</option><option value="login">تسجيل الدخول</option></select></label><label>العرض <select id="width"><option>390</option><option>360</option><option>768</option><option>1280</option></select></label><iframe id="preview" title="معاينة الموقع" width="390" src="/home.html"></iframe><script>const frame=document.getElementById('preview');document.getElementById('page').onchange=e=>frame.src='/'+e.target.value+'.html';document.getElementById('width').onchange=e=>frame.width=e.target.value;</script></html>
