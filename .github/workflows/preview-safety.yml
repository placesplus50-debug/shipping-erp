name: Preview safety checks
on:
  push:
    branches: [feature/d1-auth]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preview scripts and COD safeguards
        run: node scripts/check-preview.mjs
      - name: Run Shipping Pulse V2 core tests
        run: cd v2 && npm test
