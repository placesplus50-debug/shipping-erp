<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الطلبات والمندوبون | Shipping Pulse</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');*{box-sizing:border-box}body{font:14px Cairo,Tahoma,sans-serif;margin:0;background:#f8f7fc;color:#27193c}aside{position:fixed;right:0;top:0;bottom:0;width:245px;background:#26173e;color:white;padding:22px 15px}.brand{font-size:23px;font-weight:800;padding:12px 10px 32px}.nav{display:block;padding:14px 16px;color:#e5d9f2;text-decoration:none;border-radius:12px;font-weight:700}.nav:hover,.nav.active{background:#45335c}main{margin-right:245px}header{background:white;padding:24px 30px;border-bottom:1px solid #e8e3ee}h1{margin:0;font-size:25px}small{color:#82758f}.content{padding:30px;max-width:1400px;margin:auto}.panel{background:white;border:1px solid #ebe7f0;border-radius:18px;padding:22px;margin:15px 0;overflow:auto}input,select{font:inherit;padding:10px 14px;border:1px solid #ddd5e8;border-radius:10px;max-width:100%}input{width:min(380px,100%)}.filters{display:flex;gap:12px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:right;padding:12px;border-bottom:1px solid #eee8f4}th{background:#f8f6fc}a{color:inherit}.hint{color:#766c84}#status{background:#eee7fa;border-radius:12px;padding:12px;margin:15px 0}@media(max-width:700px){aside{position:static;width:auto;padding:10px}.brand{padding:6px}.nav{display:inline-block;padding:8px}main{margin:0}header,.content{padding:16px}}
</style><style>
:root{--pulse:#d6ff5a;--nav:#25173e}
body{background:radial-gradient(circle at 75% 5%,#eee8ff 0,transparent 31%),#f8f7fc}
aside{background:var(--nav);border-left:1px solid #46315f}
.brand{font-size:20px;letter-spacing:-.6px;color:white}
.nav{border-radius:13px;margin:4px 0;font-weight:600}
.nav.active{background:var(--pulse);color:#25173e;font-weight:800;box-shadow:0 7px 18px #caff4a22}
header{background:#ffffffdd;backdrop-filter:blur(14px)}
.panel{border-color:#ece6f3;box-shadow:0 8px 28px #35204b07}
#status{background:#eee8f7;color:#513d69}
input:focus,select:focus{outline:2px solid #d6ff5a}
</style></head><body><aside><div class="brand"><span style="background:#d6ff5a;color:#25173e;border-radius:12px;padding:5px 9px;margin-left:8px">📦</span>shipping<span style="color:#d6ff5a">pulse.</span></div><a class="nav" href="/home.html">◈ لوحة التحكم</a><a class="nav" href="/collections.html">▤ التحصيلات وكشوف الحساب</a><a class="nav" href="/orders.html">▦ الطلبات والشحنات</a><a class="nav" href="/drivers.html" class="nav active">♙ المندوبون</a></aside><main><header><small>Shipping Pulse / <span id="breadcrumb">الطلبات والشحنات</span></small><h1 id="heading">الطلبات والشحنات</h1></header><div class="content"><p class="hint">عرض مباشر للطلبات من Google Sheets، مع آخر حالة شحن محفوظة في Preview D1. هذه الصفحة للعرض فقط.</p><div class="panel filters"><input id="search" placeholder="بحث برقم الطلب أو العميل أو المندوب"><select id="filter"><option value="">كل الحالات</option></select></div><div id="status">جارٍ تحميل البيانات...</div><div class="panel"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><a href="/home.html">← الرجوع للوحة التحكم</a></div></main><script>
const mode=location.pathname.includes('drivers')?'drivers':'orders',el=id=>document.getElementById(id);let orders=[];
if(mode==='drivers'){el('heading').textContent='المندوبون';el('breadcrumb').textContent='المندوبون';el('search').placeholder='ابحث برقم المندوب';}
function cell(tr,value){const td=document.createElement('td');td.textContent=String(value??'');tr.append(td)}
function render(){const q=el('search').value.trim().toLowerCase(),f=el('filter').value;let data=[],headers=[];
if(mode==='orders'){headers=['رقم الطلب','العميل','المنطقة','المندوب','الحالة','COD'];data=orders.filter(o=>(!f||(o['Effective Shipping Status']||o['Shipping Status'])===f)&&[o['Order ID'],o.Customer,o['City / Area'],o['Driver ID']].some(v=>String(v||'').toLowerCase().includes(q))).map(o=>[o['Order ID'],o.Customer,o['City / Area'],o['Driver ID'],o['Effective Shipping Status']||o['Shipping Status'],o['COD Due']]);}
else{headers=['المندوب','إجمالي الشحنات','تم التسليم','قيد التوصيل','المرتجعات'];const groups=new Map();for(const o of orders){const id=o['Driver ID'];if(!id)continue;if(!groups.has(id))groups.set(id,{id,total:0,delivered:0,active:0,returned:0});const g=groups.get(id),status=o['Effective Shipping Status']||o['Shipping Status'];g.total++;if(status==='Delivered')g.delivered++;else if(status==='Returned')g.returned++;else g.active++;}data=[...groups.values()].filter(g=>g.id.toLowerCase().includes(q)).map(g=>[g.id,g.total,g.delivered,g.active,g.returned]);}
const head=el('head'),body=el('body');head.replaceChildren();body.replaceChildren();const hr=document.createElement('tr');headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;hr.append(th)});head.append(hr);data.forEach(row=>{const tr=document.createElement('tr');row.forEach(v=>cell(tr,v));body.append(tr)});el('status').textContent='عدد النتائج: '+data.length+(mode==='drivers'?' مندوب':' شحنة');}
async function load(){try{const r=await fetch('/api/orders',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error('تعذر تحميل الطلبات ('+r.status+')');const data=await r.json();orders=data.orders||[];if(mode==='orders'){const statuses=[...new Set(orders.map(o=>o['Effective Shipping Status']||o['Shipping Status']).filter(Boolean))].sort();statuses.forEach(s=>el('filter').add(new Option(s,s)))}else el('filter').hidden=true;render()}catch(e){el('status').textContent=e.message}}
el('search').addEventListener('input',render);el('filter').addEventListener('change',render);load();
</script></body></html>
