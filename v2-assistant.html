<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساعد Shipping Pulse</title><style>body{margin:0;background:#f7f5fc;color:#281640;font:15px Tahoma,Arial,sans-serif}header{background:linear-gradient(120deg,#24143f,#593788);color:#fff;padding:24px}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #e8e0f1;border-radius:18px;padding:20px;margin:14px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ddd4ea}input{width:100%;box-sizing:border-box}button{background:#d5ed77;border:0;cursor:pointer;margin-top:10px}#answer{line-height:1.9;white-space:pre-wrap;min-height:70px}.note{color:#786a86;font-size:13px;line-height:1.7}</style></head><body><header><h2>مساعد Shipping Pulse 2.0</h2><div>استعلامات من شحنات حسابك فقط</div></header><main><div class="card"><p>اسأل عن عدد الشحنات، التسليم، المرتجعات، المندوبين، المناطق أو COD.</p><input id="question" maxlength="300" placeholder="مثال: كام شحنة بدون مندوب؟"><button id="ask">اسأل</button><p id="answer" role="status">المساعد للقراءة فقط.</p><p class="note">النتائج مبنية على قواعد حسابية وليست نموذج AI توليدي. COD ليس إثباتًا للتحصيل الفعلي.</p></div><p><a href="/v2-operations.html">العودة لمركز العمليات</a></p></main><script type="module">import {answerQuestion} from './v2/core/operations-assistant.js';const $=id=>document.getElementById(id);let orders=null;$('ask').onclick=async()=>{try{$('answer').textContent='جاري قراءة الشحنات...';const r=await fetch('/api/orders',{credentials:'same-origin',cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'تعذر تحميل الطلبات');orders=data.orders;$('answer').textContent=answerQuestion(orders,$('question').value).answer}catch(e){$('answer').textContent=e.message}};</script></body></html>
