<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التسويات | Shipping Pulse</title><link rel="icon" href="/favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:#f7f5fc;color:#291b42}header{background:linear-gradient(125deg,#24123f,#5634a5);color:white;padding:24px 5vw}header h1{margin:4px 0;font-size:23px}header a{color:#d8f56e}main{max-width:1100px;margin:auto;padding:22px 14px 80px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat,.item{background:white;border:1px solid #ece7f5;border-radius:16px;padding:15px;box-shadow:0 4px 18px #24123f09}.stat small{display:block;color:#746c82}.stat strong{display:block;font-size:21px;margin-top:5px;color:#51309d}h2{font-size:18px;margin:24px 0 12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}input,select,button{font:inherit;border-radius:10px;padding:9px 12px;border:1px solid #ded7ea}input{flex:1;min-width:180px}button{background:#5635a9;color:white;border:0;cursor:pointer}button.secondary{background:#ede8fa;color:#51309d}.item{margin:10px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:20px;background:#efe9fb;color:#52349c;font-size:12px;font-weight:bold}.meta{display:flex;gap:12px;flex-wrap:wrap;color:#70657c;font-size:13px;margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:28px;text-align:center;color:#776a86}.error{color:#aa224b}.good{color:#167450}.note{font-size:12px;color:#746c82}#message{min-height:24px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat strong{font-size:17px}.top{align-items:start}}
</style></head><body><header><a href="/index.html">← الرئيسية</a><h1>التسويات والتحصيلات</h1><div>مراجعة التحصيلات واستلام النقدية — صلاحيات المحاسب والمدير فقط</div></header><main><div id="message" role="status"></div><div class="stats"><div class="stat"><small>بانتظار المراجعة</small><strong id="pending">—</strong></div><div class="stat"><small>نقدية مع المناديب (معتمدة)</small><strong id="driverCash">—</strong></div><div class="stat"><small>تم تسليمها</small><strong id="handed">—</strong></div><div class="stat"><small>مدفوعات الشركة</small><strong id="company">—</strong></div></div><h2>سجل التحصيلات</h2><div class="filters"><input id="search" placeholder="ابحث برقم الأوردر أو كود المندوب" aria-label="بحث"><select id="filter"><option value="all">كل الحالات</option><option value="pending">بانتظار المراجعة</option><option value="approved">معتمد</option><option value="rejected">مرفوض</option><option value="handover">بانتظار التسليم</option></select><button id="reload" class="secondary">تحديث</button></div><div id="list"></div></main><script>
const $=id=>document.getElementById(id);let rows=[];const money=c=>(Number(c||0)/100).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
async function api(url,options){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});let d;try{d=await r.json()}catch{throw Error('استجابة غير متوقعة من الخادم')}if(!r.ok)throw Error(d.error||'تعذر تنفيذ الطلب');return d}
function status(e){if(e.decision==='rejected')return 'مرفوض';if(!e.decision)return 'بانتظار المراجعة';if(e.handover_id!=null)return 'تم تسليم النقدية';if(e.method==='cash')return 'نقدية مع المندوب';return 'معتمد'}
function text(el,tag,value,cls){const n=document.createElement(tag);n.textContent=String(value??'—');if(cls)n.className=cls;el.append(n);return n}
function btn(parent,label,fn,cls){const b=text(parent,'button',label,cls);b.type='button';b.onclick=async()=>{b.disabled=true;try{await fn();await load()}catch(e){$('message').textContent=e.message;$('message').className='error'}finally{b.disabled=false}}}
async function review(e,decision){const note=prompt(decision==='approved'?'ملاحظة الاعتماد (اختياري)':'سبب الرفض (اختياري)');if(note===null)return;await api('/api/collections',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({id:e.id,decision,note})})}
async function handover(e){const destination=prompt('جهة الاستلام: اكتب cashbox للخزنة أو bank للبنك','cashbox');if(destination===null)return;if(!['cashbox','bank'].includes(destination.trim()))throw Error('اختر cashbox أو bank');const note=prompt('ملاحظة التسليم (اختياري)');if(note===null)return;if(!confirm('تأكيد استلام '+money(e.amount_cents)+' من المندوب؟'))return;await api('/api/collections',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({id:e.id,destination:destination.trim(),note})})}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value,root=$('list');root.replaceChildren();const filtered=rows.filter(e=>(!q||[e.order_id,e.driver_id].some(v=>String(v||'').toLowerCase().includes(q)))&&(f==='all'||(f==='pending'&&!e.decision)||(f==='approved'&&e.decision==='approved')||(f==='rejected'&&e.decision==='rejected')||(f==='handover'&&e.decision==='approved'&&e.method==='cash'&&e.holder==='driver'&&e.handover_id==null)));if(!filtered.length){text(root,'div','لا توجد تحصيلات مطابقة','empty');return}for(const e of filtered){const card=document.createElement('article');card.className='item';const top=document.createElement('div');top.className='top';text(top,'strong',e.order_id+' • '+money(e.amount_cents));text(top,'span',status(e),'pill');card.append(top);const meta=document.createElement('div');meta.className='meta';text(meta,'span','المندوب: '+e.driver_id);text(meta,'span','الطريقة: '+e.method);text(meta,'span','حامل المبلغ: '+e.holder);text(meta,'span','التاريخ: '+(e.created_at||'—'));card.append(meta);if(e.note)text(card,'div','ملاحظة: '+e.note,'note');const actions=document.createElement('div');actions.className='actions';if(!e.decision){btn(actions,'اعتماد التحصيل',()=>review(e,'approved'));btn(actions,'رفض التحصيل',()=>review(e,'rejected'),'secondary')}if(e.decision==='approved'&&e.method==='cash'&&e.holder==='driver'&&e.handover_id==null)btn(actions,'تأكيد استلام النقدية',()=>handover(e));if(actions.children.length)card.append(actions);root.append(card)}}
async function load(){$('message').textContent='جارٍ تحميل بيانات التسوية...';$('message').className='';$('reload').disabled=true;try{const [s,c]=await Promise.all([api('/api/v2/collection-summary'),api('/api/collections')]);if(c.truncated)throw Error('السجل غير مكتمل؛ أوقِف عرض التسويات لحماية الأرصدة');rows=c.collections||[];for(const [id,key] of [['pending','pendingReviewCents'],['driverCash','approvedDriverCashCents'],['handed','handedOverCashCents'],['company','companyHeldCents']])$(id).textContent=money(s.summary[key]);$('message').textContent='البيانات محدثة';render()}catch(e){rows=[];render();$('message').textContent=e.message;$('message').className='error'}finally{$('reload').disabled=false}}
$('search').oninput=render;$('filter').onchange=render;$('reload').onclick=load;load();
</script></body></html>
