<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة التحصيل | Shipping Pulse</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');:root{font-family:Cairo,Tahoma,Arial,sans-serif;color:#241d36;background:#f5f6fb}*{box-sizing:border-box}body{margin:0;font:14px Cairo,Tahoma,Arial;background:#f5f6fb;color:#241d36}header{background:#fff;border-bottom:1px solid #e9eaf2;color:#25183e;padding:18px max(22px,calc((100% - 1240px)/2));box-shadow:0 2px 16px #26173a08}header b{font-size:20px}main{max-width:1240px;margin:auto;padding:30px 20px 80px}h1{font-size:27px;margin:0}h2{font-size:19px;margin:0 0 18px}h3{font-size:16px;margin:0 0 10px}.intro{color:#7c7890;margin:4px 0 0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}.topactions{display:flex;gap:10px;flex-wrap:wrap}.panel{background:white;border:1px solid #e9eaf2;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 5px 26px #291b4208}button{font:inherit;padding:10px 16px;border:1px solid #e5e1ed;border-radius:11px;cursor:pointer;background:#e9f9bb;color:#304414;font-weight:800;transition:transform .15s,background .15s}button:hover{transform:translateY(-1px);background:#d9f59a}button:disabled{opacity:.45;cursor:wait}.secondary{background:white;color:#4a3d63}.secondary:hover{background:#f5f1fa}.actions{display:flex;gap:8px;flex-wrap:wrap}small{color:#8b8498}input,select,textarea{font:inherit;padding:12px;border-radius:11px;border:1px solid #e4e2eb;background:white;max-width:100%}input{width:100%}select{min-width:150px}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:18px 0}.metric{background:white;border:1px solid #e9eaf2;border-radius:17px;padding:20px;box-shadow:0 5px 24px #291b4208;min-width:0}.metric small{display:block;font-size:12px;margin-bottom:8px}.metric strong{font-size:23px;white-space:nowrap}.metric:nth-child(1){border-top:3px solid #e9a53d}.metric:nth-child(2){border-top:3px solid #6a4db4}.metric:nth-child(3){border-top:3px solid #db6c7a}.metric:nth-child(4){border-top:3px solid #edb85c}.metric:nth-child(5){border-top:3px solid #78b96c}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{background:#f8f7fc;color:#706681;font-size:12px;font-weight:800}td,th{padding:13px!important;text-align:right!important;border-bottom:1px solid #efedf3}tbody tr:hover{background:#faf9fd}#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}#list .panel{margin:0}.pill{display:inline-flex;border-radius:20px;padding:5px 12px;background:#f2edff;color:#5b3a91;font-size:12px;font-weight:800}.record-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.record-amount{font-size:23px;font-weight:800;margin:12px 0}.record-meta{color:#797184;line-height:2}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 14px}.toolbar input{max-width:390px}.modal-backdrop{position:fixed;inset:0;background:#1a1025a8;display:grid;place-items:center;z-index:20;padding:16px}.modal{background:white;border-radius:22px;padding:26px;width:min(460px,100%);box-shadow:0 20px 80px #110c2240}.modal h2{margin:0 0 10px}.modal p{color:#756c82}.modal label{display:block;margin:12px 0 6px;font-weight:700}.modal textarea,.modal select{width:100%}.modal .actions{justify-content:flex-end;margin-top:20px}@media(max-width:950px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}#list{grid-template-columns:1fr}}@media(max-width:520px){main{padding:20px 12px}.panel{padding:16px}.stats{gap:9px}.metric{padding:13px}.metric strong{font-size:18px}.topbar{align-items:flex-start}}</style></head><body><header><b>Shipping Pulse — مراجعة التحصيل</b></header><main><div class="topbar"><div><h1>تحصيل المندوبين</h1><p class="intro">إدارة التحصيلات والعهدة النقدية • بيانات Preview دون تعديل Google Sheets</p></div><div class="topactions"><button id="reload" class="secondary">↻ تحديث</button><button id="export">↓ تصدير CSV</button></div></div><div class="stats" id="summary">جارٍ التحميل...</div><div class="panel" id="breakdown"><div class="panel-head"><h2>ملخص التحصيل حسب المندوب والطريقة</h2></div><div id="groups" class="tablewrap">جارٍ التحميل...</div></div><div class="panel"><div class="panel-head"><h2>كشف حساب المندوب</h2></div><label for="driverStatement">اختر المندوب: </label><select id="driverStatement"><option value="">كل المندوبين</option></select> <button id="statementExport">تصدير كشف الحساب CSV</button><div id="statement" style="overflow-x:auto;margin-top:12px"></div></div><div class="toolbar"><h2>عمليات التحصيل</h2><input id="search" placeholder="ابحث بالشحنة أو المندوب"></div><section id="list"></section><p id="error"></p></main><script>
let rows=[];const el=id=>document.getElementById(id);
const fmt=c=>new Intl.NumberFormat('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2}).format(c/100);
function render(){
 const q=el('search').value.trim().toLowerCase(),root=el('list');root.replaceChildren();
 const totals={pending:0,approved:0,rejected:0};
 let driverCash=0,handedOver=0;for(const r of rows){totals[r.decision||'pending']+=r.amount_cents;if(r.decision==='approved'&&r.method==='cash'&&r.holder==='driver'){if(r.handover_id)handedOver+=r.amount_cents;else driverCash+=r.amount_cents;}}
 el('summary').replaceChildren(...[['قيد المراجعة',totals.pending],['تحصيل معتمد',totals.approved],['مرفوض',totals.rejected],['في عهدة المناديب',driverCash],['تم توريده',handedOver]].map(([label,value])=>{const c=document.createElement('div');c.className='metric';const t=document.createElement('small');t.textContent=label;const n=document.createElement('strong');n.textContent=fmt(value)+' ج.م';c.append(t,n);return c}));
 const groups={};for(const r of rows){const k=(r.driver_id||'بدون مندوب')+' • '+(r.method||'غير محدد');if(!groups[k])groups[k]={pending:0,approved:0,rejected:0};groups[k][r.decision||'pending']+=r.amount_cents;}
 const target=el('groups');target.replaceChildren();const table=document.createElement('table');table.style.width='100%';table.style.borderCollapse='collapse';table.innerHTML='<thead><tr><th style="text-align:right;padding:10px">المندوب • الطريقة</th><th style="text-align:right;padding:10px">قيد المراجعة</th><th style="text-align:right;padding:10px">معتمد</th><th style="text-align:right;padding:10px">مرفوض</th></tr></thead>';const body=document.createElement('tbody');for(const [k,v] of Object.entries(groups)){const tr=document.createElement('tr');for(const val of [k,fmt(v.pending)+' ج.م',fmt(v.approved)+' ج.م',fmt(v.rejected)+' ج.م']){const td=document.createElement('td');td.style.padding='10px';td.style.borderTop='1px solid #eee';td.textContent=val;tr.append(td)}body.append(tr)}table.append(body);target.append(table);if(!Object.keys(groups).length)target.textContent='لا توجد تحصيلات مسجلة';

 const sel=el('driverStatement'),previous=sel.value,drivers=[...new Set(rows.map(r=>r.driver_id).filter(Boolean))].sort();
 sel.replaceChildren(new Option('كل المندوبين',''),...drivers.map(d=>new Option(d,d)));sel.value=drivers.includes(previous)?previous:'';
 renderStatement();
 for(const r of rows.filter(x=>(x.order_id+' '+x.driver_id).toLowerCase().includes(q))){
 const card=document.createElement('article');card.className='panel';
 const title=document.createElement('h3');title.textContent=r.order_id+' — '+r.driver_id;card.append(title);
 const info=document.createElement('p');info.textContent='المبلغ: '+fmt(r.amount_cents)+' ج.م | الطريقة: '+r.method+' | الفلوس مع: '+r.holder+' | الحالة: '+(r.decision||'pending');card.append(info);
 const date=document.createElement('small');date.textContent=r.created_at;card.append(date);
 if(r.decision==='approved'&&r.method==='cash'&&r.holder==='driver'&&!r.handover_id){const b=document.createElement('button');b.textContent='تأكيد استلام النقدية';b.onclick=()=>handover(r.id);card.append(b)}else if(r.handover_id){const tag=document.createElement('p');tag.textContent='تم توريد النقدية إلى '+r.handover_destination;card.append(tag)}
 if(!r.decision){const actions=document.createElement('div');actions.className='actions';for(const [label,decision] of [['اعتماد','approved'],['رفض','rejected']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>review(r.id,decision);actions.append(b)}card.append(actions)}
 root.append(card);
 }
}
async function load(){
 try{
 const me=await fetch('/api/auth/me');if(me.status===401){location.href='/login.html';return}
 const who=await me.json();if(!['super_admin','accountant','admin'].includes(who.user.role)){el('error').textContent='غير مصرح';return}
 const res=await fetch('/api/collections',{cache:'no-store'}),data=await res.json();if(!res.ok)throw Error(data.error);
 rows=data.collections;el('error').textContent='';render()
 }catch(e){el('error').textContent=e.message}
}
function showDialog({title,description,fields=[],confirmLabel='تأكيد',danger=false}){
 return new Promise(resolve=>{
 const overlay=document.createElement('div');overlay.className='modal-backdrop';
 const form=document.createElement('form');form.className='modal';
 const h=document.createElement('h2');h.textContent=title;form.append(h);
 const p=document.createElement('p');p.textContent=description;form.append(p);
 const controls={};
 for(const field of fields){
 const label=document.createElement('label');label.textContent=field.label;form.append(label);
 const input=document.createElement(field.options?'select':'textarea');input.name=field.name;
 if(field.options)for(const [value,text] of field.options)input.add(new Option(text,value));
 else{input.rows=3;input.maxLength=500;input.placeholder='اختياري'}
 controls[field.name]=input;form.append(input);
 }
 const actions=document.createElement('div');actions.className='actions';
 const cancel=document.createElement('button');cancel.type='button';cancel.className='secondary';cancel.textContent='إلغاء';
 const submit=document.createElement('button');submit.type='submit';submit.textContent=confirmLabel;if(danger)submit.style.background='#ffe0e4';
 actions.append(cancel,submit);form.append(actions);overlay.append(form);document.body.append(overlay);
 const close=value=>{overlay.remove();resolve(value)};
 cancel.onclick=()=>close(null);
 overlay.addEventListener('click',e=>{if(e.target===overlay)close(null)});
 form.onsubmit=e=>{e.preventDefault();close(Object.fromEntries(Object.entries(controls).map(([k,v])=>[k,v.value])))};
 });
}
async function handover(id){
 const values=await showDialog({title:'تأكيد توريد النقدية',description:'أكد الاستلام الفعلي قبل حفظ التوريد. لا يمكن تكرار العملية.',fields:[{name:'destination',label:'مكان التوريد',options:[['cashbox','الخزنة'],['bank','البنك']]},{name:'note',label:'رقم الإيصال أو ملاحظات'}],confirmLabel:'تأكيد التوريد'});
 if(!values)return;
 try{const res=await fetch('/api/collections',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({id,...values})}),data=await res.json();if(!res.ok)throw Error(data.error||'فشل التوريد');await load()}
 catch(e){alert(e.message)}
}
async function review(id,decision){
 const values=await showDialog({title:decision==='approved'?'اعتماد التحصيل':'رفض التحصيل',description:'مراجعة عملية التحصيل رقم '+id+' قبل تسجيل القرار النهائي.',fields:[{name:'note',label:'ملاحظات المراجعة'}],confirmLabel:decision==='approved'?'تأكيد الاعتماد':'تأكيد الرفض',danger:decision==='rejected'});
 if(!values)return;
 try{const res=await fetch('/api/collections',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({id,decision,...values})}),data=await res.json();if(!res.ok)throw Error(data.error||'فشل المراجعة');await load()}
 catch(e){alert(e.message)}
}

function statementRows(){
 const d=el('driverStatement').value,events=[];
 for(const r of rows.filter(r=>!d||r.driver_id===d)){
  if(r.decision==='approved'&&r.method==='cash'&&r.holder==='driver'){
   events.push({date:r.reviewed_at||r.created_at,driver:r.driver_id,order:r.order_id,type:'تحصيل نقدي معتمد',inflow:r.amount_cents,outflow:0,reference:'COL-'+r.id,sort:0});
   if(r.handover_id)events.push({date:r.handed_over_at||r.created_at,driver:r.driver_id,order:r.order_id,type:'توريد إلى '+r.handover_destination,inflow:0,outflow:r.handed_over_cents??r.amount_cents,reference:'HAND-'+r.handover_id,sort:1});
  }
 }
 return events.sort((a,b)=>String(a.date).localeCompare(String(b.date))||a.sort-b.sort||a.reference.localeCompare(b.reference));
}
function statementLedger(){
 const balances=new Map();
 return statementRows().map(e=>{const balance=(balances.get(e.driver)||0)+e.inflow-e.outflow;balances.set(e.driver,balance);return {...e,balance}});
}
function renderStatement(){
 const root=el('statement');root.replaceChildren();const data=statementLedger();
 const table=document.createElement('table');table.style.width='100%';table.style.borderCollapse='collapse';
 const headers=['تاريخ الحركة','المندوب','الشحنة','الحركة','مرجع','تحصيل معتمد','توريد','رصيد عهدة المندوب'];
 const thead=document.createElement('thead'),tr=document.createElement('tr');
 for(const h of headers){const th=document.createElement('th');th.textContent=h;th.style.padding='9px';th.style.textAlign='right';tr.append(th)}thead.append(tr);table.append(thead);
 const body=document.createElement('tbody');
 for(const e of data){const row=document.createElement('tr');
  for(const val of [e.date,e.driver,e.order,e.type,e.reference,fmt(e.inflow),fmt(e.outflow),fmt(e.balance)]){
   const td=document.createElement('td');td.textContent=val;td.style.padding='9px';td.style.borderTop='1px solid #eee';row.append(td);
  }body.append(row);
 }
 table.append(body);
 if(!data.length){root.textContent='لا توجد حركات عهدة نقدية معتمدة لهذا المندوب';return}
 const totals=new Map();for(const e of data)totals.set(e.driver,e.balance);
 const summary=document.createElement('p');summary.textContent='إجمالي العهدة النقدية غير الموردة: '+fmt([...totals.values()].reduce((a,b)=>a+b,0))+' ج.م';root.append(summary,table);
}
function exportStatement(){
 const d=el('driverStatement').value;
 const lines=[['Event time','Driver','Order','Movement','Reference','Approved cash EGP','Cash handed over EGP','Driver cash balance EGP'],...statementLedger().map(e=>[e.date,e.driver,e.order,e.type,e.reference,(e.inflow/100).toFixed(2),(e.outflow/100).toFixed(2),(e.balance/100).toFixed(2)])];
 const csv='\uFEFF'+lines.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='driver-statement-'+(d||'all')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
el('driverStatement').addEventListener('change',renderStatement);
el('statementExport').addEventListener('click',exportStatement);

el('reload').onclick=load;el('search').oninput=render;el('export').onclick=()=>{
 const lines=[['ID','Order','Driver','Amount EGP','Method','Holder','Decision','Created'],...rows.map(r=>[r.id,r.order_id,r.driver_id,(r.amount_cents/100).toFixed(2),r.method,r.holder,r.decision||'pending',r.created_at])];
 const csv='\uFEFF'+lines.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='shipping-collections-preview.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
};load();
</script></body></html>
