<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Shipping Pulse - Admin Setup</title>
<style>body{font-family:Arial,sans-serif;background:#f4f6fa;min-height:100vh;display:grid;place-items:center;margin:0;padding:16px;color:#14233a}main{background:white;border-radius:18px;padding:30px;width:min(100%,420px);box-shadow:0 12px 45px #15274420;box-sizing:border-box}h1{font-size:23px}p{color:#61718a;line-height:1.7;font-size:14px}label{display:block;margin:15px 0 7px;font-weight:bold;font-size:13px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d8e1ed;border-radius:9px;direction:ltr;text-align:left}button{margin-top:22px;width:100%;padding:14px;border:0;border-radius:9px;background:#f97336;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}#message{margin-top:15px;line-height:1.6;color:#a62b36}a{color:#c85b2a}</style>
</head>
<body><main><h1>إعداد مدير Shipping Pulse</h1><p>إعداد لمرة واحدة على نسخة Preview. لا تشارك كلمة المرور أو مفتاح الإعداد مع أي شخص.</p>
<form id="setup">
<label for="name">اسم المدير</label><input id="name" required minlength="2" maxlength="100" autocomplete="name">
<label for="email">البريد الإلكتروني</label><input id="email" type="email" required maxlength="254" autocomplete="username">
<label for="password">كلمة مرور قوية (14 حرف على الأقل)</label><input id="password" type="password" required minlength="14" maxlength="256" autocomplete="new-password">
<label for="secret">مفتاح BOOTSTRAP_SECRET</label><input id="secret" type="password" required minlength="32" autocomplete="off">
<button id="submit" type="submit">إنشاء حساب المدير</button><div id="message" role="status" aria-live="polite"></div>
</form><p>بعد النجاح، احذف BOOTSTRAP_SECRET من إعدادات Cloudflare Preview ثم افتح <a href="/login.html">تسجيل الدخول</a>.</p></main>
<script>
const form=document.getElementById('setup'),message=document.getElementById('message'),button=document.getElementById('submit');
form.addEventListener('submit',async function(event){event.preventDefault();button.disabled=true;message.textContent='جارٍ إنشاء الحساب...';
try{const payload={name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),password:document.getElementById('password').value,secret:document.getElementById('secret').value};
const response=await fetch('/api/auth/bootstrap',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();
if(response.ok){form.reset();message.style.color='#16804b';message.textContent='تم إنشاء المدير. احذف BOOTSTRAP_SECRET من Cloudflare Preview فورًا.'}
else{message.textContent=response.status===409?'يوجد مستخدم بالفعل، إعداد المدير الأول غير متاح.':response.status===403?'مفتاح الإعداد غير صحيح أو غير مفعّل.':response.status===400?'راجع الاسم والبريد وكلمة المرور.':'حدث خطأ في الخادم، راجع إعدادات Preview.'}}
catch(error){message.textContent='تعذر الاتصال بالخادم.'}finally{button.disabled=false}});
</script></body></html>
