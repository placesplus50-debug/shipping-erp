<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shipping ERP</title><style>:root{font-family:Tahoma,Arial;background:#f4f6fb;color:#17243b}*{box-sizing:border-box}body{margin:0}header{background:#14223e;color:white;padding:20px 30px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:23px}small{color:#aebad0}.wrap{max-width:1250px;margin:auto;padding:25px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}button,select,input{font:inherit;padding:10px;border:1px solid #d8dfea;border-radius:9px;background:white}button{cursor:pointer}button.active,.primary{background:#f47a30;color:white;border-color:#f47a30}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card,.panel{background:white;border-radius:14px;padding:20px;box-shadow:0 3px 15px #16243a0a}.card strong{display:block;font-size:30px;margin-top:12px}.panel{margin-top:22px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:right;padding:13px;border-bottom:1px solid #eef1f6}th{color:#637089} .tag{border-radius:20px;background:#e9f2ff;padding:5px 9px;white-space:nowrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0} .muted{color:#758094} .hide{display:none}footer{padding:30px;text-align:center;color:#758094}@media(max-width:600px){header{padding:15px}.wrap{padding:12px}.card{padding:15px}}</style></head><body><header><div><h1>🚚 Shipping ERP</h1><small>إدارة الشحن والتحصيل</small></div><span>نسخة تجريبية</span></header><main class="wrap"><nav><button class="active" onclick="tab('dashboard',this)">لوحة التحكم</button><button onclick="tab('orders',this)">الأوردرات</button><button onclick="tab('driver',this)">واجهة المندوب</button><button onclick="tab('cash',this)">التحصيل</button></nav><section id="dashboard"><div class="cards" id="cards"></div><div class="panel"><h3>آخر الشحنات</h3><div id="recent"></div></div></section><section id="orders" class="hide"><div class="panel"><h3>إدارة الأوردرات</h3><div class="toolbar"><input id="search" placeholder="بحث برقم الأوردر أو العميل" oninput="render()"><select id="filter" onchange="render()"><option value="">كل الحالات</option><option>جديد</option><option>جاري التوصيل</option><option>تم التسليم</option><option>مؤجل</option><option>مرتجع</option></select><button onclick="exportCSV()">تصدير CSV</button></div><div id="ordersTable"></div></div></section><section id="driver" class="hide"><div class="panel"><h3>واجهة المندوب</h3><p class="muted">محاكاة فقط — صلاحيات الدخول الحقيقية لم تُفعّل بعد.</p><select id="driverSelect" onchange="render()"><option>علي</option><option>أنس</option><option>محمود</option><option>حسين</option></select><div id="driverOrders"></div></div></section><section id="cash" class="hide"><div class="cards" id="cashCards"></div><div class="panel"><h3>مراجعة التحصيل</h3><p class="muted">اعتماد المحاسب تجريبي ومحفوظ في المتصفح فقط.</p><div id="cashTable"></div></div></section></main><footer>بيانات وهمية للتجربة • لا يوجد اتصال حاليًا بـ Google Sheets</footer><script>const seed=[{id:'ORD-1001',name:'أحمد محمد',driver:'علي',total:850,paid:0,status:'جديد',collected:0,approved:0},{id:'ORD-1002',name:'منى خالد',driver:'أنس',total:1200,paid:1200,status:'جاري التوصيل',collected:0,approved:0},{id:'ORD-1003',name:'محمد حسن',driver:'علي',total:640,paid:200,status:'جاري التوصيل',collected:0,approved:0},{id:'ORD-1004',name:'سارة عادل',driver:'محمود',total:430,paid:0,status:'مؤجل',collected:0,approved:0},{id:'ORD-1005',name:'خالد سمير',driver:'حسين',total:990,paid:0,status:'جديد',collected:0,approved:0}];let data;try{data=JSON.parse(localStorage.getItem('shipping-erp-demo'))||seed}catch{data=seed}const save=()=>{localStorage.setItem('shipping-erp-demo',JSON.stringify(data));render()};function tab(id,btn){document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}const money=n=>Number(n||0).toLocaleString('ar-EG')+' ج';function table(items,actions=false,account=false){return '<table><thead><tr><th>الأوردر</th><th>العميل</th><th>المندوب</th><th>الحالة</th><th>المطلوب عند التسليم</th><th>المحصل</th>'+(account?'<th>المعتمد</th>':'')+(actions?'<th>تحديث</th>':'')+'</tr></thead><tbody>'+items.map(o=>'<tr><td>'+o.id+'</td><td>'+o.name+'</td><td>'+o.driver+'</td><td><span class="tag">'+o.status+'</span></td><td>'+money(o.total-o.paid)+'</td><td>'+money(o.collected)+'</td>'+(account?'<td>'+money(o.approved)+'</td>':'')+(actions?'<td><select onchange="changeStatus(\''+o.id+'\',this.value)">'+['جديد','جاري التوصيل','تم التسليم','مؤجل','مرتجع','تعذر التواصل'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select> <button onclick="collect(\''+o.id+'\')">تسجيل تحصيل</button></td>':'')+'</tr>').join('')+'</tbody></table>'}function changeStatus(id,v){data.find(x=>x.id===id).status=v;save()}function collect(id){let o=data.find(x=>x.id===id),due=o.total-o.paid;let v=prompt('المبلغ النقدي المستلم فعليًا (الحد الأقصى '+due+')',String(o.collected));if(v===null)return;let n=Number(v);if(!Number.isFinite(n)||n<o.approved||n>due||n<0){alert('مبلغ غير صالح أو أقل من مبلغ معتمد سابقًا');return}o.collected=n;save()}function approve(id){let o=data.find(x=>x.id===id);let remaining=o.collected-o.approved;let v=prompt('المبلغ الذي تم توريده واعتماده الآن (المتاح '+remaining+')',String(remaining));if(v===null)return;let n=Number(v);if(!Number.isFinite(n)||n<=0||n>remaining){alert('مبلغ غير صالح');return}o.approved+=n;save()}function render(){let c=[['إجمالي الأوردرات',data.length],['تم التسليم',data.filter(x=>x.status==='تم التسليم').length],['جاري التوصيل',data.filter(x=>x.status==='جاري التوصيل').length],['المحصل نقدًا',money(data.reduce((s,x)=>s+x.collected,0))]];document.getElementById('cards').innerHTML=c.map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');document.getElementById('recent').innerHTML=table(data.slice(0,4));let q=(document.getElementById('search').value||'').toLowerCase(),f=document.getElementById('filter').value;document.getElementById('ordersTable').innerHTML=table(data.filter(x=>(x.id.toLowerCase().includes(q)||x.name.includes(q))&&(!f||x.status===f)));document.getElementById('driverOrders').innerHTML=table(data.filter(x=>x.driver===document.getElementById('driverSelect').value),true);let pending=data.reduce((s,x)=>s+x.collected-x.approved,0);document.getElementById('cashCards').innerHTML='<div class="card">في عهدة المناديب<strong>'+money(pending)+'</strong></div><div class="card">تم اعتماد توريده<strong>'+money(data.reduce((s,x)=>s+x.approved,0))+'</strong></div>';document.getElementById('cashTable').innerHTML=table(data,true,true)+'<p>لتجربة اعتماد توريد: اضغط الزر بجانب الأوردر.</p>'+data.filter(x=>x.collected>x.approved).map(x=>'<p>'+x.id+' — متبقي '+money(x.collected-x.approved)+' <button class="primary" onclick="approve(\''+x.id+'\')">اعتماد توريد</button></p>').join('')}function exportCSV(){let rows=[['Order','Customer','Driver','Status','Total','Prepaid','Collected','Approved'],...data.map(x=>[x.id,x.name,x.driver,x.status,x.total,x.paid,x.collected,x.approved])];let csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='shipping-orders.csv';a.click();URL.revokeObjectURL(a.href)}render();</script></body></html>
