<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shipping Pulse 2.0 — إثبات التسليم</title><style>body{margin:0;background:#f7f5fc;color:#27153f;font:15px Tahoma,Arial,sans-serif}*{box-sizing:border-box}header{background:linear-gradient(120deg,#211238,#513176);color:#fff;padding:24px}main{max-width:780px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e8e0f1;border-radius:18px;padding:20px;margin:14px 0}input,textarea,button{font:inherit;border:1px solid #ddd4e7;border-radius:10px;padding:11px}input,textarea{width:100%;margin:7px 0}textarea{min-height:80px}button{background:#d5ec78;color:#281640;border:0;cursor:pointer;font-weight:bold;margin:5px 3px}canvas{width:100%;height:180px;touch-action:none;background:#fff;border:1px dashed #8e78b1;border-radius:12px}img{max-width:100%;max-height:250px;object-fit:contain}.muted{color:#796c87;line-height:1.7}.notice{background:#fff6dc;padding:12px;border-radius:10px}</style></head><body><header><h2>Shipping Pulse 2.0 — إثبات التسليم</h2><div>التوقيع والصورة · معاينة محلية لا تُرسل للخادم</div></header><main><div class="card"><h3>بيانات التسليم</h3><label>رقم الطلب<input id="order" placeholder="ORD-1001" autocomplete="off"></label><label>اسم المستلم<input id="recipient" maxlength="120"></label><label>ملاحظات<textarea id="notes" maxlength="1000"></textarea></label><label>صورة الإثبات<input id="photo" type="file" accept="image/*" capture="environment"></label><img id="preview" alt="معاينة الصورة" hidden><p class="muted">التوقيع في المربع التالي بإصبعك أو الماوس:</p><canvas id="signature"></canvas><button id="clear" type="button">مسح التوقيع</button><button id="print" type="button">طباعة محضر إثبات التسليم</button><p id="status" role="status" class="notice">المحضر معاينة محلية فقط. لا يتم تسجيل التسليم رسميًا أو تحديث حالة الشحنة.</p></div><p><a href="/v2-operations.html">العودة لمركز العمليات</a></p></main><script>
const $=id=>document.getElementById(id),canvas=$('signature'),ctx=canvas.getContext('2d');let drawing=false,hasSignature=false,photoUrl=null;
function setup(){const rect=canvas.getBoundingClientRect(),scale=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(rect.width*scale);canvas.height=Math.round(180*scale);ctx.setTransform(scale,0,0,scale,0,0);ctx.lineWidth=2.3;ctx.lineCap='round';ctx.strokeStyle='#25143f';hasSignature=false}setup();const pos=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();hasSignature=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>drawing=false);$('clear').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);hasSignature=false};$('photo').onchange=()=>{if(photoUrl)URL.revokeObjectURL(photoUrl);const file=$('photo').files[0];if(!file){$('preview').hidden=true;return}if(!file.type.startsWith('image/')||file.size>5_000_000){$('status').textContent='اختر صورة أقل من 5 ميجابايت';$('photo').value='';return}photoUrl=URL.createObjectURL(file);$('preview').src=photoUrl;$('preview').hidden=false};window.addEventListener('pagehide',()=>{if(photoUrl)URL.revokeObjectURL(photoUrl)});$('print').onclick=()=>{const order=$('order').value.trim(),recipient=$('recipient').value.trim();if(!/^ORD-[A-Za-z0-9-]{1,50}$/.test(order)||!recipient||!hasSignature){$('status').textContent='أدخل رقم طلب صحيح واسم المستلم والتوقيع';return}const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const win=window.open('','_blank');if(!win){$('status').textContent='اسمح بفتح نافذة الطباعة';return}const sig=canvas.toDataURL('image/png');const photo=$('preview').hidden?'':$('preview').src;win.document.write('<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>محضر إثبات تسليم</title><style>body{font:16px Tahoma;padding:30px}img{max-width:350px;max-height:260px}h1{color:#291742}.warn{border:2px solid #a66;padding:12px}</style><h1>محضر إثبات تسليم — نسخة معاينة</h1><p class="warn">غير معتمد: لم يتم التحقق من الطلب أو رفع الإثبات للنظام</p><p>الطلب: '+escape(order)+'</p><p>المستلم: '+escape(recipient)+'</p><p>الملاحظات: '+escape($('notes').value)+'</p><p>التوقيع:</p><img src="'+sig+'">'+(photo?'<p>الصورة المرفقة:</p><img src="'+photo+'">':'')+'</html>');win.document.close();$('status').textContent='تم فتح محضر المعاينة للطباعة. لم تُحفظ بيانات على الخادم.'};
</script></body></html>
